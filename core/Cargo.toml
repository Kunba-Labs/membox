[package]
name = "membox-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"

[lib]
name = "membox_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The UniFFI surface for iOS. Off for the desktop (Tauri) build.
mobile-ffi = ["dep:uniffi"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["mobile-ffi"]

[dependencies]
uniffi = { version = "0.28", optional = true, features = ["cli"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = { version = "0.4", features = ["std"] }
tiny_http = "0.12"
rand = "0.8"
parking_lot = "0.12"
which = "7"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
